[package]
name = "linapo-cli"
description = "Command line tool: apply Equalizer APO profiles to PipeWire"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "linapo"
path = "src/main.rs"

[dependencies]
linapo-core = { path = "../linapo-core" }
linapo-pw = { path = "../linapo-pw" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
hound = "3.5"

[dev-dependencies]
hound = "3.5"
